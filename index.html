<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudit Astro | Advanced Simulations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Import Map for Three.js and OrbitControls -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: 'Inter', sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        .sci-font { font-family: 'Orbitron', sans-serif; }
        
        /* Glassmorphism UI */
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .nav-btn.active {
            background: rgba(99, 102, 241, 0.8);
            color: white;
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
            border-color: rgba(99, 102, 241, 1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 3px; }

        /* Graph Canvas for Exoplanet Mode */
        #graph-container {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            width: 320px;
            height: 200px;
            pointer-events: none;
            display: none; /* Hidden by default */
        }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div class="absolute inset-0 pointer-events-none flex flex-col justify-between z-10">
        
        <!-- Header -->
        <div class="p-6 pointer-events-auto flex justify-between items-start">
            <div class="glass-panel p-4 rounded-xl mb-4 md:mb-0">
                <div class="flex items-center gap-3 mb-1">
                    <i class="fas fa-atom text-indigo-400 text-2xl animate-pulse"></i>
                    <h1 class="text-2xl font-bold text-white sci-font tracking-wider">MUDIT ASTRO LAB</h1>
                </div>
                <div class="text-xs text-indigo-300 uppercase tracking-widest">Interactive Simulation Engine v2.1</div>
            </div>

            <!-- Navigation Buttons -->
            <div class="glass-panel rounded-xl flex flex-wrap gap-2 p-2 max-w-2xl">
                <button onclick="switchMode('solar')" id="btn-solar" class="nav-btn active px-4 py-2 rounded-lg text-gray-300 hover:text-white transition-all text-sm font-semibold flex items-center gap-2">
                    <i class="fas fa-sun"></i> Solar System
                </button>
                <button onclick="switchMode('blackhole')" id="btn-blackhole" class="nav-btn px-4 py-2 rounded-lg text-gray-300 hover:text-white transition-all text-sm font-semibold flex items-center gap-2">
                    <i class="fas fa-circle-notch"></i> Black Hole
                </button>
                <button onclick="switchMode('singularity')" id="btn-singularity" class="nav-btn px-4 py-2 rounded-lg text-gray-300 hover:text-white transition-all text-sm font-semibold flex items-center gap-2">
                    <i class="fas fa-project-diagram"></i> Singularity
                </button>
                <button onclick="switchMode('darkmatter')" id="btn-darkmatter" class="nav-btn px-4 py-2 rounded-lg text-gray-300 hover:text-white transition-all text-sm font-semibold flex items-center gap-2">
                    <i class="fas fa-ghost"></i> Dark Matter
                </button>
                <!-- New Features -->
                <button onclick="switchMode('exoplanet')" id="btn-exoplanet" class="nav-btn px-4 py-2 rounded-lg text-gray-300 hover:text-white transition-all text-sm font-semibold flex items-center gap-2">
                    <i class="fas fa-chart-area"></i> Exoplanet Transit
                </button>
                <button onclick="switchMode('binary')" id="btn-binary" class="nav-btn px-4 py-2 rounded-lg text-gray-300 hover:text-white transition-all text-sm font-semibold flex items-center gap-2">
                    <i class="fas fa-star-half-alt"></i> Binary Stars
                </button>
            </div>
        </div>

        <!-- Info Panel (Bottom Left) -->
        <div class="p-6 w-full max-w-md pointer-events-auto">
            <div class="glass-panel p-6 rounded-xl transition-all duration-500" id="info-panel">
                <h2 class="text-xl text-white sci-font font-bold mb-2" id="info-title">Solar System</h2>
                <p class="text-gray-300 text-sm leading-relaxed mb-4" id="info-desc">
                    A heliocentric model showing planetary orbits. Notice the difference in orbital speeds based on Kepler's laws: planets closer to the sun orbit faster.
                </p>
                
                <!-- Dynamic Controls Container -->
                <div id="controls-container" class="border-t border-gray-700 pt-3">
                    <div class="text-xs text-gray-400 mb-2"><i class="fas fa-mouse"></i> Drag to Rotate | Scroll to Zoom</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Graph Overlay for Exoplanet Mode -->
    <div id="graph-container" class="glass-panel rounded-xl p-4">
        <div class="text-white text-xs font-bold mb-2 sci-font">LIGHT CURVE (BRIGHTNESS VS TIME)</div>
        <canvas id="graph-canvas" width="600" height="300" class="w-full h-full"></canvas>
    </div>

    <!-- 3D Canvas -->
    <canvas id="bg-canvas"></canvas>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Core Setup ---
        const canvas = document.querySelector('#bg-canvas');
        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.002);
        
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 20, 40);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Global variables for cleanup
        let animationId;
        let currentObjects = [];
        let tickFunction = null; // Specific update function for the current mode

        // --- Starfield Background (Persistent) ---
        function createStarfield() {
            const geometry = new THREE.BufferGeometry();
            const vertices = [];
            for (let i = 0; i < 5000; i++) {
                vertices.push(
                    THREE.MathUtils.randFloatSpread(400),
                    THREE.MathUtils.randFloatSpread(400),
                    THREE.MathUtils.randFloatSpread(400)
                );
            }
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            const material = new THREE.PointsMaterial({ color: 0xffffff, size: 0.3, transparent: true, opacity: 0.8 });
            const stars = new THREE.Points(geometry, material);
            scene.add(stars);
        }
        createStarfield();

        // --- Cleanup Function ---
        function clearScene() {
            currentObjects.forEach(obj => {
                scene.remove(obj);
                if (obj.geometry) obj.geometry.dispose();
                if (obj.material) {
                    if (Array.isArray(obj.material)) {
                        obj.material.forEach(m => m.dispose());
                    } else {
                        obj.material.dispose();
                    }
                }
            });
            currentObjects = [];
            tickFunction = null;
            
            // Hide graph by default
            document.getElementById('graph-container').style.display = 'none';

            // Remove any dynamically added DOM controls
            const container = document.getElementById('controls-container');
            // Keep the static instruction text, remove other children
            while (container.children.length > 1) {
                container.removeChild(container.lastChild);
            }
        }

        // ==========================================
        // MODE 1: SOLAR SYSTEM
        // ==========================================
        function initSolarSystem() {
            camera.position.set(0, 30, 50);
            
            // Sun
            const sunGeo = new THREE.SphereGeometry(4, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffaa00 });
            const sun = new THREE.Mesh(sunGeo, sunMat);
            
            // Sun Glow
            const glowGeo = new THREE.SphereGeometry(4.5, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({ color: 0xff4400, transparent: true, opacity: 0.3, side: THREE.BackSide });
            const glow = new THREE.Mesh(glowGeo, glowMat);
            sun.add(glow);

            // Point Light from Sun
            const light = new THREE.PointLight(0xffffff, 2, 100);
            sun.add(light);
            
            scene.add(sun);
            currentObjects.push(sun);

            // Planets Data
            const planets = [
                { name: 'Mercury', r: 0.8, dist: 7, color: 0xaaaaaa, speed: 0.04 },
                { name: 'Venus', r: 1.2, dist: 11, color: 0xc2a365, speed: 0.03 },
                { name: 'Earth', r: 1.3, dist: 16, color: 0x2233ff, speed: 0.025 },
                { name: 'Mars', r: 1.0, dist: 21, color: 0xff3300, speed: 0.02 },
                { name: 'Jupiter', r: 3.0, dist: 30, color: 0xd9b38c, speed: 0.01 },
                { name: 'Saturn', r: 2.5, dist: 40, color: 0xe6ccb3, speed: 0.008, ring: true }
            ];

            const planetMeshes = [];

            planets.forEach(p => {
                const group = new THREE.Group();
                
                // Orbit path (visual line)
                const pathGeo = new THREE.RingGeometry(p.dist - 0.1, p.dist + 0.1, 64);
                const pathMat = new THREE.MeshBasicMaterial({ color: 0xffffff, opacity: 0.1, transparent: true, side: THREE.DoubleSide });
                const path = new THREE.Mesh(pathGeo, pathMat);
                path.rotation.x = Math.PI / 2;
                scene.add(path);
                currentObjects.push(path);

                // Planet Body
                const geo = new THREE.SphereGeometry(p.r, 32, 32);
                const mat = new THREE.MeshStandardMaterial({ color: p.color, roughness: 0.7 });
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.x = p.dist;
                group.add(mesh);

                // Saturn Ring
                if (p.ring) {
                    const ringGeo = new THREE.RingGeometry(p.r + 0.5, p.r + 2, 32);
                    const ringMat = new THREE.MeshBasicMaterial({ color: 0xaa8866, side: THREE.DoubleSide, transparent: true, opacity: 0.8 });
                    const ring = new THREE.Mesh(ringGeo, ringMat);
                    ring.rotation.x = Math.PI / 2;
                    mesh.add(ring);
                }

                scene.add(group);
                currentObjects.push(group);
                planetMeshes.push({ group, speed: p.speed, dist: p.dist, mesh: mesh });
            });

            // Ambient light for planets
            const ambient = new THREE.AmbientLight(0x404040);
            scene.add(ambient);
            currentObjects.push(ambient);

            tickFunction = (time) => {
                sun.rotation.y += 0.005;
                planetMeshes.forEach(p => {
                    p.group.rotation.y += p.speed; // Orbit
                    p.mesh.rotation.y += 0.02;     // Self rotation
                });
            };
        }

        // ==========================================
        // MODE 2: BLACK HOLE
        // ==========================================
        function initBlackHole() {
            camera.position.set(0, 10, 25);

            // 1. Event Horizon (The Black Sphere)
            const bhGeo = new THREE.SphereGeometry(3, 64, 64);
            const bhMat = new THREE.MeshBasicMaterial({ color: 0x000000 });
            const blackHole = new THREE.Mesh(bhGeo, bhMat);
            scene.add(blackHole);
            currentObjects.push(blackHole);

            // 2. Accretion Disk (Particles)
            const particlesCount = 8000;
            const posArray = new Float32Array(particlesCount * 3);
            const colorArray = new Float32Array(particlesCount * 3);
            
            const colorInside = new THREE.Color(0xffaa00); // Hot inner disk
            const colorOutside = new THREE.Color(0xcc3300); // Cooler outer disk

            for(let i = 0; i < particlesCount; i++) {
                const i3 = i * 3;
                // Spiral distribution
                const radius = 4 + Math.random() * 8; 
                const angle = Math.random() * Math.PI * 2;
                
                // Flatten the y-axis but give it some thickness
                const y = (Math.random() - 0.5) * (10 / radius); // thinner at edges

                posArray[i3] = Math.cos(angle) * radius;
                posArray[i3+1] = y;
                posArray[i3+2] = Math.sin(angle) * radius;

                // Color based on radius (hotter closer to center)
                const mixedColor = colorInside.clone().lerp(colorOutside, (radius - 4) / 8);
                colorArray[i3] = mixedColor.r;
                colorArray[i3+1] = mixedColor.g;
                colorArray[i3+2] = mixedColor.b;
            }

            const diskGeo = new THREE.BufferGeometry();
            diskGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            diskGeo.setAttribute('color', new THREE.BufferAttribute(colorArray, 3));

            const diskMat = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                transparent: true,
                opacity: 0.8
            });

            const disk = new THREE.Points(diskGeo, diskMat);
            scene.add(disk);
            currentObjects.push(disk);

            // 3. Gravitational Lensing Halo (Fake Effect)
            const haloGeo = new THREE.RingGeometry(3, 3.2, 64);
            const haloMat = new THREE.MeshBasicMaterial({ 
                color: 0xffffff, 
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.5
            });
            const halo = new THREE.Mesh(haloGeo, haloMat);
            halo.lookAt(camera.position); // Always face camera
            scene.add(halo);
            currentObjects.push(halo);

            tickFunction = (time) => {
                disk.rotation.y -= 0.02; // Spin the accretion disk
                halo.lookAt(camera.position); // Update halo to face camera
                
                // Optional: Pulse the halo
                halo.scale.setScalar(1 + Math.sin(time * 2) * 0.02);
            };
        }

        // ==========================================
        // MODE 3: SINGULARITY (Spacetime Grid)
        // ==========================================
        function initSingularity() {
            camera.position.set(0, 15, 20);

            // Create a plane with many segments
            const size = 30;
            const divisions = 40;
            const geo = new THREE.PlaneGeometry(size, size, divisions, divisions);
            
            // Initial positions
            const initialPositions = geo.attributes.position.array.slice();
            
            const mat = new THREE.MeshBasicMaterial({ 
                color: 0x00ffcc, 
                wireframe: true, 
                transparent: true, 
                opacity: 0.5,
                side: THREE.DoubleSide
            });
            const grid = new THREE.Mesh(geo, mat);
            grid.rotation.x = -Math.PI / 2;
            scene.add(grid);
            currentObjects.push(grid);

            // A ball representing the singularity point
            const singMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const singGeo = new THREE.SphereGeometry(0.2, 16, 16);
            const singularity = new THREE.Mesh(singGeo, singMat);
            scene.add(singularity);
            currentObjects.push(singularity);

            // Falling particles
            const pCount = 200;
            const pGeo = new THREE.BufferGeometry();
            const pPos = new Float32Array(pCount * 3);
            for(let i=0; i<pCount*3; i+=3) {
                pPos[i] = (Math.random() - 0.5) * 20;
                pPos[i+1] = 5 + Math.random() * 5;
                pPos[i+2] = (Math.random() - 0.5) * 20;
            }
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const pMat = new THREE.PointsMaterial({ color: 0xff0000, size: 0.2 });
            const particles = new THREE.Points(pGeo, pMat);
            scene.add(particles);
            currentObjects.push(particles);

            tickFunction = (time) => {
                const positions = grid.geometry.attributes.position.array;
                
                // Warping Logic
                for (let i = 0; i < positions.length; i += 3) {
                    const x = initialPositions[i];
                    const y = initialPositions[i + 1];
                    // Calculate distance from center (0,0)
                    const dist = Math.sqrt(x * x + y * y);
                    
                    // Create the "gravity well" dip
                    // -10 / (dist + 1) creates a hyperbolic curve downwards
                    // We add a sine wave for "ripples" in spacetime
                    const warp = -15 / (dist + 0.5) + (Math.sin(time * 2 - dist) * 0.2);
                    
                    positions[i + 2] = warp; // In PlaneGeometry, Z is the dimension perpendicular to face before rotation
                }
                grid.geometry.attributes.position.needsUpdate = true;

                // Particle Animation (Falling in)
                const pArr = particles.geometry.attributes.position.array;
                for(let i=0; i<pCount*3; i+=3) {
                    const x = pArr[i];
                    const z = pArr[i+2];
                    const dist = Math.sqrt(x*x + z*z);
                    
                    if(dist < 0.5) {
                        // Reset if it hits center
                        pArr[i] = (Math.random() - 0.5) * 20;
                        pArr[i+1] = 5 + Math.random() * 5;
                        pArr[i+2] = (Math.random() - 0.5) * 20;
                    } else {
                        // Move towards center
                        pArr[i] *= 0.98;
                        pArr[i+2] *= 0.98;
                        // Move down based on gravity well shape approximation
                        pArr[i+1] = Math.max(-10, -10 / (dist + 0.1));
                    }
                }
                particles.geometry.attributes.position.needsUpdate = true;
            };
        }

        // ==========================================
        // MODE 4: DARK MATTER (Galaxy Rotation)
        // ==========================================
        let isDarkMatterOn = false;

        function initDarkMatter() {
            camera.position.set(0, 40, 0);
            
            const count = 10000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const orbitParams = []; // Store angle and radius for each star

            const colorCenter = new THREE.Color(0xffddaa);
            const colorEdge = new THREE.Color(0x5555ff);

            for (let i = 0; i < count; i++) {
                const i3 = i * 3;
                // Spiral Galaxy math
                const branches = 3;
                const radius = Math.random() * 20 + 0.5;
                const spinAngle = radius * 0.5; // Twist factor
                const branchAngle = (i % branches) / branches * Math.PI * 2;
                
                const randomOffset = Math.pow(Math.random(), 3) * (Math.random() < 0.5 ? 1 : -1) * 0.5;
                const angle = branchAngle + spinAngle + randomOffset;

                positions[i3] = Math.cos(angle) * radius;
                positions[i3+1] = (Math.random() - 0.5) * (2 / radius); // Flat disk
                positions[i3+2] = Math.sin(angle) * radius;

                orbitParams.push({ radius: radius, angle: angle, speedMod: Math.random() * 0.2 + 0.9 });

                const mixedColor = colorCenter.clone().lerp(colorEdge, radius / 20);
                colors[i3] = mixedColor.r;
                colors[i3+1] = mixedColor.g;
                colors[i3+2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.15,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            const galaxy = new THREE.Points(geometry, material);
            scene.add(galaxy);
            currentObjects.push(galaxy);

            // UI Toggle for Dark Matter
            const btn = document.createElement('button');
            btn.innerHTML = `<i class="fas fa-toggle-off"></i> Toggle Dark Matter`;
            btn.className = "mt-4 w-full py-2 bg-indigo-600 hover:bg-indigo-500 rounded text-white font-bold transition-colors";
            btn.onclick = () => {
                isDarkMatterOn = !isDarkMatterOn;
                btn.innerHTML = isDarkMatterOn 
                    ? `<i class="fas fa-toggle-on"></i> Dark Matter: ON` 
                    : `<i class="fas fa-toggle-off"></i> Dark Matter: OFF`;
                
                // Update Info Text
                const desc = document.getElementById('info-desc');
                desc.innerHTML = isDarkMatterOn 
                    ? "<b>Dark Matter ON:</b> Observed reality. Outer stars move almost as fast as inner stars due to invisible mass (Dark Matter)."
                    : "<b>Dark Matter OFF:</b> Newtonian prediction. Stars further away should move much slower, like planets in solar system.";
            };
            document.getElementById('controls-container').appendChild(btn);

            tickFunction = (time) => {
                const positions = galaxy.geometry.attributes.position.array;
                
                for(let i=0; i<count; i++) {
                    const i3 = i * 3;
                    const p = orbitParams[i];
                    
                    // VELOCITY LOGIC
                    let velocity;
                    if (isDarkMatterOn) {
                        // Flat Rotation Curve: Velocity is roughly constant regardless of distance
                        velocity = 0.5 / p.radius * (p.radius * 0.8); 
                        // Simplified visual: speed doesn't drop off much
                        velocity = 0.02 * p.speedMod; 
                    } else {
                        // Keplerian/Newtonian: Velocity drops with distance (v ~ 1/sqrt(r))
                        velocity = (1 / Math.sqrt(p.radius)) * 0.1 * p.speedMod;
                    }

                    p.angle += velocity;

                    positions[i3] = Math.cos(p.angle) * p.radius;
                    positions[i3+2] = Math.sin(p.angle) * p.radius;
                }
                galaxy.geometry.attributes.position.needsUpdate = true;
            };
        }

        // ==========================================
        // MODE 5: EXOPLANET TRANSIT (Light Curves)
        // ==========================================
        function initExoplanet() {
            camera.position.set(0, 0, 30);
            
            // 1. The Star
            const starGeo = new THREE.SphereGeometry(5, 64, 64);
            const starMat = new THREE.MeshBasicMaterial({ color: 0xffdd44 });
            const star = new THREE.Mesh(starGeo, starMat);
            // Add a massive glow
            const glowGeo = new THREE.SphereGeometry(6, 32, 32);
            const glowMat = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.3, side: THREE.BackSide });
            star.add(new THREE.Mesh(glowGeo, glowMat));
            scene.add(star);
            currentObjects.push(star);

            // 2. The Transiting Planet
            const planetGeo = new THREE.SphereGeometry(1.5, 32, 32);
            const planetMat = new THREE.MeshBasicMaterial({ color: 0x000000 }); // Silhouette
            const planet = new THREE.Mesh(planetGeo, planetMat);
            scene.add(planet);
            currentObjects.push(planet);

            // 3. 2D Graph Setup
            const graphContainer = document.getElementById('graph-container');
            graphContainer.style.display = 'block';
            const canvas2d = document.getElementById('graph-canvas');
            const ctx = canvas2d.getContext('2d');
            
            // Graph data buffer
            const dataPoints = [];
            const maxPoints = 150;
            for(let i=0; i<maxPoints; i++) dataPoints.push(1.0); // Init flat line

            tickFunction = (time) => {
                // Orbit Logic (Ellipse)
                const speed = 1.5;
                const radiusX = 12;
                const radiusZ = 4; // Flat orbit relative to camera
                const angle = time * speed;
                
                planet.position.x = Math.cos(angle) * radiusX;
                planet.position.z = Math.sin(angle) * radiusZ + 4; // +4 to be in front of star sometimes

                // Brightness Logic
                // If planet is in front of star (z > 0) AND overlaps x range
                let brightness = 1.0;
                if (planet.position.z > 0 && Math.abs(planet.position.x) < 5.5) {
                    brightness = 0.85; // Dip in brightness
                } else {
                    brightness = 1.0;
                }

                // Update Graph Data
                dataPoints.push(brightness);
                if (dataPoints.length > maxPoints) dataPoints.shift();

                // Draw Graph
                ctx.clearRect(0, 0, canvas2d.width, canvas2d.height);
                
                // Draw Grid
                ctx.strokeStyle = 'rgba(255,255,255,0.1)';
                ctx.beginPath();
                ctx.moveTo(0, canvas2d.height/2);
                ctx.lineTo(canvas2d.width, canvas2d.height/2);
                ctx.stroke();

                // Draw Line
                ctx.strokeStyle = '#facc15'; // Yellow
                ctx.lineWidth = 3;
                ctx.beginPath();
                const stepX = canvas2d.width / maxPoints;
                
                for (let i = 0; i < dataPoints.length; i++) {
                    const val = dataPoints[i];
                    // Map 1.0 to 20%, 0.85 to 80% height (inverted y)
                    // 1.0 -> 50px, 0.85 -> 250px
                    const y = (val === 1.0) ? 50 : 200; 
                    
                    if (i === 0) ctx.moveTo(0, y);
                    else ctx.lineTo(i * stepX, y);
                }
                ctx.stroke();
            };
        }

        // ==========================================
        // MODE 6: BINARY STARS (Center of Mass)
        // ==========================================
        function initBinary() {
            camera.position.set(0, 30, 0);
            
            // Barycenter Marker (Invisible pivot or small dot)
            const barycenterGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const barycenterMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const barycenter = new THREE.Mesh(barycenterGeo, barycenterMat);
            scene.add(barycenter);
            currentObjects.push(barycenter);

            // Star A (Massive, Blue)
            const starAGeo = new THREE.SphereGeometry(2, 32, 32);
            const starAMat = new THREE.MeshStandardMaterial({ color: 0x4488ff, emissive: 0x2244aa });
            const starA = new THREE.Mesh(starAGeo, starAMat);
            scene.add(starA);
            currentObjects.push(starA);

            // Star B (Smaller, Red)
            const starBGeo = new THREE.SphereGeometry(1, 32, 32);
            const starBMat = new THREE.MeshStandardMaterial({ color: 0xff4444, emissive: 0xaa2222 });
            const starB = new THREE.Mesh(starBGeo, starBMat);
            scene.add(starB);
            currentObjects.push(starB);

            // Lighting
            const light = new THREE.PointLight(0xffffff, 1, 100);
            scene.add(light);
            currentObjects.push(light);

            // Trail setup
            const trailCount = 200;
            const trailAGeo = new THREE.BufferGeometry();
            const trailBGeo = new THREE.BufferGeometry();
            const posA = new Float32Array(trailCount * 3);
            const posB = new Float32Array(trailCount * 3);
            trailAGeo.setAttribute('position', new THREE.BufferAttribute(posA, 3));
            trailBGeo.setAttribute('position', new THREE.BufferAttribute(posB, 3));
            
            const trailAMat = new THREE.PointsMaterial({ color: 0x4488ff, size: 0.2 });
            const trailBMat = new THREE.PointsMaterial({ color: 0xff4444, size: 0.2 });
            
            const trailA = new THREE.Points(trailAGeo, trailAMat);
            const trailB = new THREE.Points(trailBGeo, trailBMat);
            scene.add(trailA); scene.add(trailB);
            currentObjects.push(trailA); currentObjects.push(trailB);

            let tick = 0;

            tickFunction = (time) => {
                // Physics Simulation
                // M1 * r1 = M2 * r2
                // Let M1 = 2 (Blue), M2 = 1 (Red)
                // Distance = 15
                // r1 = 5, r2 = 10
                
                const angle = time * 0.8;
                
                // Update Star Positions
                starA.position.set(Math.cos(angle) * 5, 0, Math.sin(angle) * 5);
                starB.position.set(Math.cos(angle + Math.PI) * 10, 0, Math.sin(angle + Math.PI) * 10);

                // Update Trails (Shift array)
                // Shift existing positions
                for(let i = 0; i < (trailCount-1) * 3; i++) {
                    posA[i] = posA[i+3];
                    posB[i] = posB[i+3];
                }
                // Add new position at end
                const idx = (trailCount-1)*3;
                posA[idx] = starA.position.x; posA[idx+1] = starA.position.y; posA[idx+2] = starA.position.z;
                posB[idx] = starB.position.x; posB[idx+1] = starB.position.y; posB[idx+2] = starB.position.z;

                trailA.geometry.attributes.position.needsUpdate = true;
                trailB.geometry.attributes.position.needsUpdate = true;
            };
        }

        // --- Main Animation Loop ---
        const clock = new THREE.Clock();
        function animate() {
            animationId = requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            if (tickFunction) tickFunction(time);

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- Window Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // --- Logic to Switch Modes ---
        window.switchMode = (mode) => {
            // Update UI buttons
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');

            // Cleanup old scene
            clearScene();

            // Set Title/Desc
            const title = document.getElementById('info-title');
            const desc = document.getElementById('info-desc');

            if (mode === 'solar') {
                title.innerText = "Solar System";
                desc.innerText = "Observe the orbital mechanics of our neighborhood. The inner rocky planets orbit rapidly, while the gas giants take years to complete a circle. This follows Kepler's Laws.";
                initSolarSystem();
            } else if (mode === 'blackhole') {
                title.innerText = "Black Hole & Event Horizon";
                desc.innerHTML = "<b>Event Horizon:</b> The boundary where gravity is so strong light cannot escape.<br><b>Accretion Disk:</b> Matter swirling into the hole, heating up and glowing.<br>Note: In reality, gravity would bend light behind the hole to the top and bottom (Gravitational Lensing).";
                initBlackHole();
            } else if (mode === 'singularity') {
                title.innerText = "Spacetime Singularity";
                desc.innerText = "A visualization of General Relativity. Mass curves spacetime (the grid). A Singularity (center) is a point of infinite density where the curvature becomes infinite, represented here by the grid plunging endlessly downward.";
                initSingularity();
            } else if (mode === 'darkmatter') {
                title.innerText = "Galaxy Rotation Curve";
                desc.innerText = "Why do we believe in Dark Matter? Use the toggle below. Without Dark Matter, galaxies should fly apart because outer stars move too slow to stay in orbit. In reality, they move fast, proving extra invisible mass exists.";
                isDarkMatterOn = false; // reset state
                initDarkMatter();
            } else if (mode === 'exoplanet') {
                title.innerText = "Exoplanet Transit Method";
                desc.innerText = "How do we find planets? We stare at stars. When a planet passes in front (transits), the star's brightness dips slightly. Watch the graph on the right as the planet crosses the star.";
                initExoplanet();
            } else if (mode === 'binary') {
                title.innerText = "Binary Star System";
                desc.innerText = "Most stars are not alone! They come in pairs. Here, a massive blue star and a lighter red star orbit their common center of mass (Barycenter). Notice the blue star moves in a smaller circle because it is heavier.";
                initBinary();
            }
        };

        // Initialize default
        initSolarSystem();

    </script>
</body>
</html>
